<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community - Zeb89 Fanpage</title>
<link rel="icon" href="logo.png">
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: #dbeafe;
    line-height: 1.6;
    overflow-x: hidden;
    background:
      radial-gradient(circle at 15% 8%, rgba(80,170,255,.35), transparent 38%),
      radial-gradient(circle at 90% 35%, rgba(40,120,220,.35), transparent 42%),
      linear-gradient(160deg, #0a1f3d 0%, #07152b 50%, #030a16 100%);
    background-attachment: fixed;
  }
  .wrap { width: 100%; max-width: 760px; margin: 0 auto; padding: 18px; }

  .glass {
    background: linear-gradient(180deg, rgba(120,190,255,.22), rgba(20,50,95,.35));
    border: 1px solid rgba(140,200,255,.45);
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(0,0,0,.6), inset 0 1px 0 rgba(200,230,255,.5);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    padding: 20px;
    margin-bottom: 18px;
  }

  header.glass { margin-top: 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; padding: 20px 24px; }
  
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo-small {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid rgba(140,200,255,.7);
  }

  h1 {
    margin: 0;
    font-size: 1.6rem;
    color: #fff;
    text-shadow: 0 0 10px rgba(90,180,255,.8);
  }

  .btn {
    display: inline-block;
    padding: 10px 20px;
    color: #fff;
    font-weight: 600;
    font-size: 0.9rem;
    text-decoration: none;
    border: 1px solid #6cc0ff;
    border-radius: 999px;
    background: linear-gradient(180deg, #5cc0ff 0%, #1f7fd8 50%, #0d56ad 51%, #2a96e8 100%);
    box-shadow: 0 0 12px rgba(80,170,255,.6), inset 0 1px 0 rgba(255,255,255,.7);
    cursor: pointer;
  }
  .btn:active { filter: brightness(.9); }

  /* Sezione Auth (Login / Register) */
  .auth-box {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 400px;
    margin: 0 auto;
  }
  .auth-input, .post-input-text, .post-input-textarea {
    width: 100%;
    background: rgba(5,20,45,0.8);
    border: 1px solid rgba(120,185,255,0.3);
    border-radius: 8px;
    padding: 10px 14px;
    color: #fff;
    font-size: 0.9rem;
  }
  .auth-input:focus, .post-input-text:focus, .post-input-textarea:focus {
    outline: none;
    border-color: #5cc0ff;
  }
  .auth-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .user-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(10,30,60,0.6);
    border: 1px solid rgba(120,185,255,0.3);
    border-radius: 12px;
    padding: 12px 18px;
    margin-bottom: 18px;
  }
  .user-info { font-weight: 600; color: #5cc0ff; }

  /* Form Nuovo Post */
  .create-post-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }
  .post-input-textarea { resize: vertical; min-height: 80px; }

  /* Cards dei Post */
  .post-card {
    background: rgba(5,20,45,.65);
    border: 1px solid rgba(120,185,255,.35);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .post-date { font-size: 0.85rem; color: #8fb4dc; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
  .author-tag { color: #5cc0ff; font-weight: 600; }
  
  .post-title { margin: 0 0 8px; font-size: 1.15rem; color: #fff; }
  .post-content { margin: 0 0 12px; color: #bcd9f7; font-size: 0.9rem; line-height: 1.4; }

  .post-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(120,185,255,.2);
    padding-top: 10px;
    margin-top: 10px;
  }

  .comment-toggle-btn {
    background: transparent;
    border: 1px solid rgba(120,185,255,0.3);
    color: #8fb4dc;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
  }
  .comment-toggle-btn:hover {
    background: rgba(80,170,255,0.15);
    color: #fff;
  }

  .vote-btn {
    background: rgba(80,170,255,0.1);
    border: 1px solid rgba(120,185,255,0.3);
    color: #bcd9f7;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
  }
  .vote-btn:hover { background: rgba(80,170,255,0.25); border-color: rgba(120,185,255,0.6); }
  .vote-btn.active {
    background: linear-gradient(180deg, #5cc0ff 0%, #1f7fd8 100%);
    color: #fff;
    border-color: #8fd0ff;
    box-shadow: 0 0 10px rgba(80,170,255,0.5);
  }

  /* Sezione Commenti */
  .comments-section {
    display: none;
    margin-top: 14px;
    border-top: 1px dashed rgba(120,185,255,0.3);
    padding-top: 12px;
  }
  .comments-section.open { display: block; }

  .comment-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 10px;
    background: rgba(10,30,60,0.4);
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid rgba(120,185,255,0.15);
  }

  .comment-body h4 { margin: 0 0 2px; font-size: 0.9rem; color: #5cc0ff; }
  .comment-body p { margin: 0; font-size: 0.85rem; color: #bcd9f7; }

  .add-comment-box { display: flex; gap: 8px; margin-top: 10px; }
  .comment-input {
    flex-grow: 1;
    background: rgba(5,20,45,0.8);
    border: 1px solid rgba(120,185,255,0.3);
    border-radius: 8px;
    padding: 8px 12px;
    color: #fff;
    font-size: 0.85rem;
  }
  .comment-submit {
    background: linear-gradient(180deg, #5cc0ff 0%, #1f7fd8 100%);
    border: none;
    color: #fff;
    padding: 0 14px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.85rem;
  }

  footer { text-align: center; color: #8fb4dc; font-size: .9rem; padding: 10px 0 40px; }
  .error-msg { color: #ff6b6b; font-size: 0.85rem; text-align: center; display: none; }
</style>
</head>
<body>
<div class="wrap">

  <header class="glass">
    <div class="header-left">
      <img class="logo-small" src="community.png" alt="Logo Community">
      <h1>Post della Community</h1>
    </div>
    <a class="btn" href="index.html">← Torna alla Home</a>
  </header>

  <!-- Box Login / Registrazione con Nickname -->
  <section id="auth-section" class="glass">
    <h2 style="text-align: center;">Accesso Community</h2>
    <p style="text-align: center;">Inserisci il tuo nickname e password per pubblicare e commentare.</p>
    
    <div class="auth-box">
      <input type="text" id="auth-nickname" class="auth-input" placeholder="Nickname">
      <input type="password" id="auth-password" class="auth-input" placeholder="Password">
      <div id="auth-error" class="error-msg"></div>
      <div class="auth-actions">
        <button class="btn" onclick="loginUser()">Accedi</button>
        <button class="btn" style="background: transparent;" onclick="registerUser()">Registrati</button>
      </div>
    </div>
  </section>

  <!-- Pannello Utente Autenticato -->
  <div id="user-panel" class="user-bar" style="display: none;">
    <div>Connesso come <span id="current-username" class="user-info"></span></div>
    <button class="btn" style="padding: 4px 14px; font-size: 0.8rem;" onclick="logoutUser()">Esci</button>
  </div>

  <!-- Form Pubblica Nuovo Post (solo se loggato) -->
  <section id="create-post-section" class="glass" style="display: none;">
    <h2>Crea un nuovo post</h2>
    <div class="create-post-form">
      <input type="text" id="post-title-input" class="post-input-text" placeholder="Titolo del post...">
      <textarea id="post-content-input" class="post-input-textarea" placeholder="Cosa ne pensi?"></textarea>
      <button class="btn" style="align-self: flex-end;" onclick="publishPost()">Pubblica Post</button>
    </div>
  </section>

  <!-- Contenitore Post da Firebase -->
  <div id="posts-container">
    <div class="glass" style="text-align: center;">Caricamento post in corso...</div>
  </div>

  <footer>Zeb89 Fanpage · Tutti i diritti riservati</footer>

</div>

<!-- Firebase SDK via CDN -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
  import { 
    getAuth, 
    createUserWithEmailAndPassword, 
    signInWithEmailAndPassword, 
    signOut, 
    onAuthStateChanged,
    updateProfile 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { 
    getFirestore, 
    collection, 
    addDoc, 
    getDocs, 
    query, 
    orderBy, 
    onSnapshot,
    serverTimestamp 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAHtswW-j0O0tWHHOyJP6QROFvsN_SKHqs",
    authDomain: "zeb89fanpage-9a3dc.firebaseapp.com",
    projectId: "zeb89fanpage-9a3dc",
    storageBucket: "zeb89fanpage-9a3dc.firebasestorage.app",
    messagingSenderId: "630651020835",
    appId: "1:630651020835:web:51e425c5e35d782f8e7396",
    measurementId: "G-578X21KF8L"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Genera una email fittizia dal nickname
  function nickToEmail(nick) {
    const cleanNick = nick.trim().toLowerCase().replace(/[^a-z0-9]/g, "");
    return `${cleanNick}@zeb89fanpage.local`;
  }

  // Registrazione Utente
  window.registerUser = async function() {
    const nick = document.getElementById('auth-nickname').value.trim();
    const pass = document.getElementById('auth-password').value;
    const errDiv = document.getElementById('auth-error');

    if (!nick || !pass) {
      showError("Inserisci nickname e password.");
      return;
    }

    try {
      const email = nickToEmail(nick);
      const userCred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(userCred.user, { displayName: nick });
      errDiv.style.display = 'none';
    } catch (err) {
      showError("Errore registazione: nickname già preso o password troppo corta.");
    }
  };

  // Login Utente
  window.loginUser = async function() {
    const nick = document.getElementById('auth-nickname').value.trim();
    const pass = document.getElementById('auth-password').value;

    if (!nick || !pass) {
      showError("Inserisci nickname e password.");
      return;
    }

    try {
      const email = nickToEmail(nick);
      await signInWithEmailAndPassword(auth, email, pass);
      document.getElementById('auth-error').style.display = 'none';
    } catch (err) {
      showError("Nickname o password non validi.");
    }
  };

  // Logout Utente
  window.logoutUser = function() {
    signOut(auth);
  };

  function showError(msg) {
    const errDiv = document.getElementById('auth-error');
    errDiv.textContent = msg;
    errDiv.style.display = 'block';
  }

  // Gestione stato Auth UI
  onAuthStateChanged(auth, (user) => {
    const authSec = document.getElementById('auth-section');
    const userPan = document.getElementById('user-panel');
    const createSec = document.getElementById('create-post-section');
    const nameSpan = document.getElementById('current-username');

    if (user) {
      authSec.style.display = 'none';
      userPan.style.display = 'flex';
      createSec.style.display = 'block';
      nameSpan.textContent = user.displayName || user.email.split('@')[0];
    } else {
      authSec.style.display = 'block';
      userPan.style.display = 'none';
      createSec.style.display = 'none';
    }
  });

  // Pubblicazione Post su Firestore
  window.publishPost = async function() {
    const title = document.getElementById('post-title-input').value.trim();
    const content = document.getElementById('post-content-input').value.trim();

    if (!title || !content) return;

    try {
      await addDoc(collection(db, "posts"), {
        title: title,
        content: content,
        author: auth.currentUser.displayName || "Anonimo",
        createdAt: serverTimestamp()
      });
      document.getElementById('post-title-input').value = "";
      document.getElementById('post-content-input').value = "";
    } catch (e) {
      alert("Errore durante la pubblicazione del post.");
    }
  };

  // Pubblicazione Commento su Firestore
  window.addFirebaseComment = async function(postId, btn) {
    const input = btn.previousElementSibling;
    const text = input.value.trim();

    if (!text || !auth.currentUser) {
      if(!auth.currentUser) alert("Devi accedere per commentare!");
      return;
    }

    try {
      await addDoc(collection(db, "posts", postId, "comments"), {
        text: text,
        author: auth.currentUser.displayName || "Anonimo",
        createdAt: serverTimestamp()
      });
      input.value = "";
    } catch (e) {
      alert("Errore durante l'invio del commento.");
    }
  };

  // Listener In Tempo Reale dei Post su Firestore
  const postsQuery = query(collection(db, "posts"), orderBy("createdAt", "desc"));
  onSnapshot(postsQuery, (snapshot) => {
    const container = document.getElementById('posts-container');
    container.innerHTML = "";

    if (snapshot.empty) {
      container.innerHTML = `<div class="glass" style="text-align: center;">Nessun post presente. Sii il primo a pubblicare!</div>`;
      return;
    }

    snapshot.docs.forEach(docSnap => {
      const post = docSnap.data();
      const postId = docSnap.id;
      const dateStr = post.createdAt ? new Date(post.createdAt.seconds * 1000).toLocaleDateString("it-IT", { day: 'numeric', month: 'long', year: 'numeric' }) : "Inviando...";

      const card = document.createElement('div');
      card.className = 'post-card';
      card.innerHTML = `
        <div class="post-date">
          <span>📅 ${dateStr}</span>
          <span class="author-tag">${escapeHtml(post.author)}</span>
        </div>
        <div class="post-title"><strong>${escapeHtml(post.title)}</strong></div>
        <p class="post-content">${escapeHtml(post.content)}</p>
        
        <div class="post-footer">
          <button class="comment-toggle-btn" onclick="toggleComments(this)">💬 Mostra commenti</button>
          <button class="vote-btn" onclick="this.classList.toggle('active')">👍︎</button>
        </div>

        <div class="comments-section">
          <div id="comments-list-${postId}">Cultura commenti in corso...</div>
          <div class="add-comment-box">
            <input type="text" class="comment-input" placeholder="Scrivi un commento...">
            <button class="comment-submit" onclick="window.addFirebaseComment('${postId}', this)">Invia</button>
          </div>
        </div>
      `;
      container.appendChild(card);

      // Listener per i commenti del singolo post
      const commentsQuery = query(collection(db, "posts", postId, "comments"), orderBy("createdAt", "asc"));
      onSnapshot(commentsQuery, (commSnap) => {
        const commList = document.getElementById(`comments-list-${postId}`);
        if(commList) {
          commList.innerHTML = "";
          commSnap.docs.forEach(cDoc => {
            const cData = cDoc.data();
            const item = document.createElement('div');
            item.className = 'comment-item';
            item.innerHTML = `
              <div class="comment-body">
                <h4>${escapeHtml(cData.author)}</h4>
                <p>${escapeHtml(cData.text)}</p>
              </div>
            `;
            commList.appendChild(item);
          });
        }
      });
    });
  });

  window.toggleComments = function(btn) {
    const card = btn.closest('.post-card');
    const section = card.querySelector('.comments-section');
    section.classList.toggle('open');
    btn.textContent = section.classList.contains('open') ? '💬 Nascondi commenti' : '💬 Mostra commenti';
  };

  function escapeHtml(text) {
    if(!text) return "";
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
</script>
</body>
</html>

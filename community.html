  .wrap { width: 100%; max-width: 760px; margin: 0 auto; padding: 18px; }

  .glass {
    background: linear-gradient(180deg, rgba(120,190,255,.22), rgba(20,50,95,.35));
    border: 1px solid rgba(140,200,255,.45);
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(0,0,0,.6), inset 0 1px 0 rgba(200,230,255,.5);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    padding: 20px;
    margin-bottom: 18px;
  }

  header.glass { margin-top: 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; padding: 20px 24px; }
  
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo-small {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid rgba(140,200,255,.7);
  }

  h1 {
    margin: 0;
    font-size: 1.6rem;
    color: #fff;
    text-shadow: 0 0 10px rgba(90,180,255,.8);
  }

  .btn {
    display: inline-block;
    padding: 10px 20px;
    color: #fff;
    font-weight: 600;
    font-size: 0.9rem;
    text-decoration: none;
    border: 1px solid #6cc0ff;
    border-radius: 999px;
    background: linear-gradient(180deg, #5cc0ff 0%, #1f7fd8 50%, #0d56ad 51%, #2a96e8 100%);
    box-shadow: 0 0 12px rgba(80,170,255,.6), inset 0 1px 0 rgba(255,255,255,.7);
  }
  .btn:active { filter: brightness(.9); }

  h2 { margin: 0 0 10px; font-size: 1.35rem; color: #fff; text-shadow: 0 0 8px rgba(90,180,255,.6); }
  p { margin: 0 0 10px; color: #bcd9f7; }

  .post-card {
    background: rgba(5,20,45,.65);
    border: 1px solid rgba(120,185,255,.35);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .post-date { font-size: 0.85rem; color: #8fb4dc; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
  .author-tag { color: #5cc0ff; font-weight: 600; }
  
  .post-title { margin: 0 0 8px; font-size: 1.15rem; color: #fff; }
  .post-content { margin: 0 0 12px; color: #bcd9f7; font-size: 0.85rem; line-height: 1.4; opacity: 0.85; }

  .post-image {
    width: 100%;
    max-height: 350px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid rgba(120,185,255,.3);
    margin-bottom: 12px;
  }

  .post-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(120,185,255,.2);
    padding-top: 10px;
    margin-top: 10px;
  }

  .comment-toggle-btn {
    background: transparent;
    border: 1px solid rgba(120,185,255,0.3);
    color: #8fb4dc;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
  }
  .comment-toggle-btn:hover {
    background: rgba(80,170,255,0.15);
    color: #fff;
  }

  .vote-btn {
    background: rgba(80,170,255,0.1);
    border: 1px solid rgba(120,185,255,0.3);
    color: #bcd9f7;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
  }

    background: rgba(80,170,255,0.25);
    border-color: rgba(120,185,255,0.6);
  }

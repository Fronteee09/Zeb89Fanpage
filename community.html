<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community - Zeb89 Fanpage</title>
<link rel="icon" href="logo.png">
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: #dbeafe;
    line-height: 1.6;
    overflow-x: hidden;
    background:
      radial-gradient(circle at 15% 8%, rgba(80,170,255,.35), transparent 38%),
      radial-gradient(circle at 90% 35%, rgba(40,120,220,.35), transparent 42%),
      linear-gradient(160deg, #0a1f3d 0%, #07152b 50%, #030a16 100%);
    background-attachment: fixed;
  }
  .wrap { width: 100%; max-width: 760px; margin: 0 auto; padding: 18px; }

  .glass {
    background: linear-gradient(180deg, rgba(120,190,255,.22), rgba(20,50,95,.35));
    border: 1px solid rgba(140,200,255,.45);
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(0,0,0,.6), inset 0 1px 0 rgba(200,230,255,.5);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    padding: 20px;
    margin-bottom: 18px;
  }

  header.glass { margin-top: 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; padding: 20px 24px; }
  
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo-small {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid rgba(140,200,255,.7);
  }

  h1 {
    margin: 0;
    font-size: 1.6rem;
    color: #fff;
    text-shadow: 0 0 10px rgba(90,180,255,.8);
  }

  .btn {
    display: inline-block;
    padding: 8px 16px;
    color: #fff;
    font-weight: 600;
    font-size: 0.9rem;
    text-decoration: none;
    border: 1px solid #6cc0ff;
    border-radius: 999px;
    background: linear-gradient(180deg, #5cc0ff 0%, #1f7fd8 50%, #0d56ad 51%, #2a96e8 100%);
    box-shadow: 0 0 12px rgba(80,170,255,.6), inset 0 1px 0 rgba(255,255,255,.7);
    cursor: pointer;
  }
  .btn:active { filter: brightness(.9); }
  .btn-danger {
    background: linear-gradient(180deg, #ff6b6b 0%, #c92a2a 100%);
    border-color: #ffa8a8;
    box-shadow: 0 0 10px rgba(255,107,107,0.5);
  }

  .auth-box {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 400px;
    margin: 0 auto;
  }
  .auth-input, .post-input-text, .post-input-textarea {
    width: 100%;
    background: rgba(5,20,45,0.8);
    border: 1px solid rgba(120,185,255,0.3);
    border-radius: 8px;
    padding: 10px 14px;
    color: #fff;
    font-size: 0.9rem;
  }
  .auth-input:focus, .post-input-text:focus, .post-input-textarea:focus {
    outline: none;
    border-color: #5cc0ff;
  }
  .user-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(10,30,60,0.6);
    border: 1px solid rgba(120,185,255,0.3);
    border-radius: 12px;
    padding: 12px 18px;
    margin-bottom: 18px;
  }
  .user-info { font-weight: 600; color: #5cc0ff; }

  .create-post-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }
  .post-input-textarea { resize: vertical; min-height: 80px; }

  .post-card {
    background: rgba(5,20,45,.65);
    border: 1px solid rgba(120,185,255,.35);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .post-date { font-size: 0.85rem; color: #8fb4dc; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
  .author-tag { color: #5cc0ff; font-weight: 600; }
  
  .post-title { margin: 0 0 8px; font-size: 1.15rem; color: #fff; }
  .post-content { margin: 0 0 12px; color: #bcd9f7; font-size: 0.9rem; line-height: 1.4; }

  .post-media {
    margin-bottom: 12px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid rgba(120,185,255,0.3);
  }
  .post-media img {
    width: 100%;
    max-height: 350px;
    object-fit: cover;
    display: block;
  }
  .post-media iframe {
    width: 100%;
    height: 315px;
    border: none;
    display: block;
  }

  .post-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(120,185,255,.2);
    padding-top: 10px;
    margin-top: 10px;
  }

  .comment-toggle-btn {
    background: transparent;
    border: 1px solid rgba(120,185,255,0.3);
    color: #8fb4dc;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
  }
  .comment-toggle-btn:hover { background: rgba(80,170,255,0.15); color: #fff; }

  .comments-section {
    display: none;
    margin-top: 14px;
    border-top: 1px dashed rgba(120,185,255,0.3);
    padding-top: 12px;
  }
  .comments-section.open { display: block; }

  .comment-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 10px;
    background: rgba(10,30,60,0.4);
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid rgba(120,185,255,0.15);
  }
  .comment-body h4 { margin: 0 0 2px; font-size: 0.9rem; color: #5cc0ff; }
  .comment-body p { margin: 0; font-size: 0.85rem; color: #bcd9f7; word-break: break-word; }

  .add-comment-box { display: flex; gap: 8px; margin-top: 10px; }
  .comment-input {
    flex-grow: 1;
    background: rgba(5,20,45,0.8);
    border: 1px solid rgba(120,185,255,0.3);
    border-radius: 8px;
    padding: 8px 12px;
    color: #fff;
    font-size: 0.85rem;
  }

  footer { text-align: center; color: #8fb4dc; font-size: .9rem; padding: 10px 0 40px; }
  .error-msg { color: #ff6b6b; font-size: 0.85rem; text-align: center; display: none; }
</style>
</head>
<body>
<div class="wrap">

  <header class="glass">
    <div class="header-left">
      <img class="logo-small" src="logo.png" alt="Logo Community">
      <h1>Post della Community</h1>
    </div>
    <a class="btn" href="index.html">← Torna alla Home</a>
  </header>

  <!-- Sezione Auth -->
  <section id="auth-section" class="glass">
    <h2 style="text-align: center;">Accesso Community</h2>
    <div class="auth-box">
      <input type="text" id="auth-nickname" class="auth-input" placeholder="Nickname">
      <input type="password" id="auth-password" class="auth-input" placeholder="Password">
      <div id="auth-error" class="error-msg"></div>
      <div style="display: flex; gap: 10px; justify-content: center; margin-top: 5px;">
        <button class="btn" onclick="loginUser()">Accedi</button>
        <button class="btn" style="background: transparent;" onclick="registerUser()">Registrati</button>
      </div>
    </div>
  </section>

  <!-- Pannello Utente Loggato -->
  <div id="user-panel" class="user-bar" style="display: none;">
    <div>Connesso come <span id="current-username" class="user-info"></span></div>
    <button class="btn btn-danger" style="padding: 4px 12px; font-size: 0.8rem;" onclick="logoutUser()">Esci</button>
  </div>

  <!-- Form Pubblica Post -->
  <section id="create-post-section" class="glass" style="display: none;">
    <h2>Crea un nuovo post</h2>
    <div class="create-post-form">
      <input type="text" id="post-title-input" class="post-input-text" placeholder="Titolo del post...">
      <textarea id="post-content-input" class="post-input-textarea" placeholder="Corpo del testo..."></textarea>
      <input type="text" id="post-youtube-input" class="post-input-text" placeholder="Link YouTube (opzionale, es. https://youtu.be/...)">
      <input type="text" id="post-reddit-img-input" class="post-input-text" placeholder="Link Immagine Reddit (opzionale, es. https://i.redd.it/...)">
      <button class="btn" style="align-self: flex-end;" onclick="publishPost()">Pubblica Post</button>
    </div>
  </section>

  <!-- Lista Post -->
  <div id="posts-container">
    <div class="glass" style="text-align: center;">Caricamento post in corso...</div>
  </div>

  <footer>Zeb89 Fanpage · Tutti i diritti riservati</footer>

</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getAuth, 
    createUserWithEmailAndPassword, 
    signInWithEmailAndPassword, 
    signOut, 
    onAuthStateChanged,
    updateProfile 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { 
    getFirestore, 
    collection, 
    addDoc, 
    deleteDoc,
    doc, 
    query, 
    orderBy, 
    onSnapshot,
    serverTimestamp 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAHtswW-j0O0tWHHOyJP6QROFvsN_SKHqs",
    authDomain: "zeb89fanpage-9a3dc.firebaseapp.com",
    projectId: "zeb89fanpage-9a3dc",
    storageBucket: "zeb89fanpage-9a3dc.firebasestorage.app",
    messagingSenderId: "630651020835",
    appId: "1:630651020835:web:51e425c5e35d782f8e7396",
    measurementId: "G-578X21KF8L"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  function nickToEmail(nick) {
    const cleanNick = nick.trim().toLowerCase().replace(/[^a-z0-9]/g, "");
    return `${cleanNick}@zeb89fanpage.local`;
  }

  window.registerUser = async function() {
    const nick = document.getElementById('auth-nickname').value.trim();
    const pass = document.getElementById('auth-password').value;
    if (!nick || !pass) return showError("Inserisci nickname e password.");
    try {
      const userCred = await createUserWithEmailAndPassword(auth, nickToEmail(nick), pass);
      await updateProfile(userCred.user, { displayName: nick });
    } catch (err) {
      showError("Errore registrazione: nickname già in uso o password troppo corta.");
    }
  };

  window.loginUser = async function() {
    const nick = document.getElementById('auth-nickname').value.trim();
    const pass = document.getElementById('auth-password').value;
    if (!nick || !pass) return showError("Inserisci nickname e password.");
    try {
      await signInWithEmailAndPassword(auth, nickToEmail(nick), pass);
    } catch (err) {
      showError("Nickname o password non validi.");
    }
  };

  window.logoutUser = () => signOut(auth);

  function showError(msg) {
    const errDiv = document.getElementById('auth-error');
    errDiv.textContent = msg;
    errDiv.style.display = 'block';
  }

  onAuthStateChanged(auth, (user) => {
    document.getElementById('auth-section').style.display = user ? 'none' : 'block';
    document.getElementById('user-panel').style.display = user ? 'flex' : 'none';
    document.getElementById('create-post-section').style.display = user ? 'block' : 'none';
    if (user) document.getElementById('current-username').textContent = user.displayName;
  });

  // Funzione per convertire link YouTube in Embed sicuro
  function getYouTubeEmbedUrl(url) {
    if (!url) return null;
    let videoId = "";
    if (url.includes("youtu.be/")) {
      videoId = url.split("youtu.be/")[1]?.split("?")[0];
    } else if (url.includes("watch?v=")) {
      videoId = url.split("watch?v=")[1]?.split("&")[0];
    }
    return videoId ? `https://www.youtube.com/embed/${videoId}` : null;
  }

  // Pubblica Post
  window.publishPost = async function() {
    const title = document.getElementById('post-title-input').value.trim();
    const content = document.getElementById('post-content-input').value.trim();
    const ytUrl = document.getElementById('post-youtube-input').value.trim();
    const redditImg = document.getElementById('post-reddit-img-input').value.trim();

    if (!title || !content) {
      alert("Il titolo e il corpo del testo sono obbligatori!");
      return;
    }

    // Validazione immagini Reddit opzionale ma consigliata
    if (redditImg && !redditImg.includes("redd.it") && !redditImg.includes("reddit.com")) {
      alert("L'immagine deve provenire da Reddit (es. i.redd.it)");
      return;
    }

    try {
      await addDoc(collection(db, "posts"), {
        title,
        content,
        youtubeUrl: getYouTubeEmbedUrl(ytUrl),
        redditImage: redditImg || null,
        author: auth.currentUser.displayName,
        uid: auth.currentUser.uid,
        createdAt: serverTimestamp()
      });
      document.getElementById('post-title-input').value = "";
      document.getElementById('post-content-input').value = "";
      document.getElementById('post-youtube-input').value = "";
      document.getElementById('post-reddit-img-input').value = "";
    } catch (e) {
      alert("Errore nella pubblicazione del post.");
    }
  };

  // Elimina Post (Solo autore)
  window.deletePost = async function(postId) {
    if (confirm("Vuoi davvero eliminare questo post?")) {
      try {
        await deleteDoc(doc(db, "posts", postId));
      } catch (e) {
        alert("Non hai i permessi per eliminare questo post.");
      }
    }
  };

  // Aggiungi Commento (Blocco link web)
  window.addFirebaseComment = async function(postId, btn) {
    const input = btn.previousElementSibling;
    const text = input.value.trim();

    if (!text) return;
    if (text.includes("http://") || text.includes("https://") || text.includes("www.")) {
      alert("Nei commenti non è consentito inserire link web o immagini!");
      return;
    }

    try {
      await addDoc(collection(db, "posts", postId, "comments"), {
        text,
        author: auth.currentUser.displayName,
        uid: auth.currentUser.uid,
        createdAt: serverTimestamp()
      });
      input.value = "";
    } catch (e) {
      alert("Errore nell'invio del commento.");
    }
  };

  // Elimina Commento (Autore commento o Autore post)
  window.deleteComment = async function(postId, commentId) {
    try {
      await deleteDoc(doc(db, "posts", postId, "comments", commentId));
    } catch (e) {
      alert("Non puoi eliminare questo commento.");
    }
  };

  // Listener Realtime Post
  const postsQuery = query(collection(db, "posts"), orderBy("createdAt", "desc"));
  onSnapshot(postsQuery, (snapshot) => {
    const container = document.getElementById('posts-container');
    container.innerHTML = "";

    if (snapshot.empty) {
      container.innerHTML = `<div class="glass" style="text-align: center;">Nessun post presente.</div>`;
      return;
    }

    snapshot.docs.forEach(docSnap => {
      const post = docSnap.data();
      const postId = docSnap.id;
      const dateStr = post.createdAt ? new Date(post.createdAt.seconds * 1000).toLocaleDateString("it-IT", { day: 'numeric', month: 'long', year: 'numeric' }) : "Inviando...";
      const isMyPost = auth.currentUser && auth.currentUser.uid === post.uid;

      let mediaHtml = "";
      if (post.redditImage) {
        mediaHtml += `<div class="post-media"><img src="${escapeHtml(post.redditImage)}" alt="Immagine Reddit"></div>`;
      }
      if (post.youtubeUrl) {
        mediaHtml += `<div class="post-media"><iframe src="${post.youtubeUrl}" allowfullscreen></iframe></div>`;
      }

      const card = document.createElement('div');
      card.className = 'post-card';
      card.innerHTML = `
        <div class="post-date">
          <span>📅 ${dateStr} — <span class="author-tag">${escapeHtml(post.author)}</span></span>
          ${isMyPost ? `<button class="btn btn-danger" style="padding: 2px 8px; font-size: 0.75rem;" onclick="deletePost('${postId}')">Elimina Post</button>` : ''}
        </div>
        <div class="post-title"><strong>${escapeHtml(post.title)}</strong></div>
        <p class="post-content">${escapeHtml(post.content)}</p>
        ${mediaHtml}
        
        <div class="post-footer">
          <button class="comment-toggle-btn" onclick="toggleComments(this)">💬 Mostra commenti</button>
        </div>

        <div class="comments-section">
          <div id="comments-list-${postId}">Caricamento...</div>
          <div class="add-comment-box">
            <input type="text" class="comment-input" placeholder="Scrivi un commento (senza link)..." onkeydown="if(event.key==='Enter') addFirebaseComment('${postId}', this.nextElementSibling)">
            <button class="btn" style="padding: 6px 12px; font-size: 0.8rem;" onclick="addFirebaseComment('${postId}', this)">Invia</button>
          </div>
        </div>
      `;
      container.appendChild(card);

      // Listener Commenti
      onSnapshot(query(collection(db, "posts", postId, "comments"), orderBy("createdAt", "asc")), (commSnap) => {
        const commList = document.getElementById(`comments-list-${postId}`);
        if(commList) {
          commList.innerHTML = commSnap.empty ? "<p style='font-size:0.8rem; color:#8fb4dc; margin-bottom:8px;'>Nessun commento.</p>" : "";
          commSnap.docs.forEach(cDoc => {
            const cData = cDoc.data();
            const cId = cDoc.id;
            const canDeleteComment = auth.currentUser && (auth.currentUser.uid === cData.uid || auth.currentUser.uid === post.uid);

            const item = document.createElement('div');
            item.className = 'comment-item';
            item.innerHTML = `
              <div class="comment-body">
                <h4>${escapeHtml(cData.author)}</h4>
                <p>${escapeHtml(cData.text)}</p>
              </div>
              ${canDeleteComment ? `<button class="btn btn-danger" style="padding: 2px 6px; font-size: 0.7rem;" onclick="deleteComment('${postId}', '${cId}')">X</button>` : ''}
            `;
            commList.appendChild(item);
          });
        }
      });
    });
  });

  window.toggleComments = function(btn) {
    const card = btn.closest('.post-card');
    const section = card.querySelector('.comments-section');
    section.classList.toggle('open');
    btn.textContent = section.classList.contains('open') ? '💬 Nascondi commenti' : '💬 Mostra commenti';
  };

  function escapeHtml(text) {
    if(!text) return "";
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
</script>
</body>
</html>

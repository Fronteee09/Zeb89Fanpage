<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annunci e Post - Zeb89 Fanpage</title>
<link rel="icon" href="logo.png">
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: #dbeafe;
    line-height: 1.6;
    overflow-x: hidden;
    background:
      radial-gradient(circle at 15% 8%, rgba(80,170,255,.35), transparent 38%),
      radial-gradient(circle at 90% 35%, rgba(40,120,220,.35), transparent 42%),
      linear-gradient(160deg, #0a1f3d 0%, #07152b 50%, #030a16 100%);
    background-attachment: fixed;
  }
  .wrap { width: 100%; max-width: 760px; margin: 0 auto; padding: 18px; }

  .glass {
    background: linear-gradient(180deg, rgba(120,190,255,.22), rgba(20,50,95,.35));
    border: 1px solid rgba(140,200,255,.45);
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(0,0,0,.6), inset 0 1px 0 rgba(200,230,255,.5);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    padding: 20px;
    margin-bottom: 18px;
  }

  header.glass { margin-top: 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; padding: 20px 24px; }
  
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo-small {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid rgba(140,200,255,.7);
  }

  h1 {
    margin: 0;
    font-size: 1.6rem;
    color: #fff;
    text-shadow: 0 0 10px rgba(90,180,255,.8);
  }

  .btn {
    display: inline-block;
    padding: 8px 16px;
    color: #fff;
    font-weight: 600;
    font-size: 0.9rem;
    text-decoration: none;
    border: 1px solid #6cc0ff;
    border-radius: 999px;
    background: linear-gradient(180deg, #5cc0ff 0%, #1f7fd8 50%, #0d56ad 51%, #2a96e8 100%);
    box-shadow: 0 0 12px rgba(80,170,255,.6), inset 0 1px 0 rgba(255,255,255,.7);
    cursor: pointer;
  }
  .btn:active { filter: brightness(.9); }
  .btn-danger {
    background: linear-gradient(180deg, #ff6b6b 0%, #c92a2a 100%);
    border-color: #ffa8a8;
  }

  .create-announcement-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 15px;
  }
  .input-field {
    width: 100%;
    background: rgba(5,20,45,0.8);
    border: 1px solid rgba(120,185,255,0.3);
    border-radius: 8px;
    padding: 10px 14px;
    color: #fff;
    font-size: 0.9rem;
  }
  .input-field:focus { outline: none; border-color: #5cc0ff; }
  textarea.input-field { resize: vertical; min-height: 80px; }

  h2 { margin: 0 0 10px; font-size: 1.35rem; color: #fff; text-shadow: 0 0 8px rgba(90,180,255,.6); }
  p { margin: 0 0 10px; color: #bcd9f7; }

  .post-card {
    background: rgba(5,20,45,.65);
    border: 1px solid rgba(120,185,255,.35);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .post-date { font-size: 0.85rem; color: #8fb4dc; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
  .author-tag { color: #5cc0ff; font-weight: 600; }
  
  .post-title { margin: 0 0 8px; font-size: 1.15rem; color: #fff; }
  .post-content { margin: 0 0 12px; color: #bcd9f7; font-size: 0.9rem; line-height: 1.4; }

  .post-media {
    margin-bottom: 12px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid rgba(120,185,255,0.3);
  }
  .post-media img {
    width: 100%;
    max-height: 350px;
    object-fit: cover;
    display: block;
  }
  .post-media iframe {
    width: 100%;
    height: 315px;
    border: none;
    display: block;
  }

  .post-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(120,185,255,.2);
    padding-top: 10px;
    margin-top: 10px;
  }

  .vote-btn {
    background: rgba(80,170,255,0.1);
    border: 1px solid rgba(120,185,255,0.3);
    color: #bcd9f7;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
  }
  .vote-btn:hover { background: rgba(80,170,255,0.25); border-color: rgba(120,185,255,0.6); }
  .vote-btn.active {
    background: linear-gradient(180deg, #5cc0ff 0%, #1f7fd8 100%);
    color: #fff;
    border-color: #8fd0ff;
    box-shadow: 0 0 10px rgba(80,170,255,0.5);
  }

  .comment-toggle-btn {
    background: transparent;
    border: 1px solid rgba(120,185,255,0.3);
    color: #8fb4dc;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
  }
  .comment-toggle-btn:hover { background: rgba(80,170,255,0.15); color: #fff; }

  .comments-section {
    display: none;
    margin-top: 14px;
    border-top: 1px dashed rgba(120,185,255,0.3);
    padding-top: 12px;
  }
  .comments-section.open { display: block; }

  .comment-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 10px;
    background: rgba(10,30,60,0.4);
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid rgba(120,185,255,0.15);
  }
  .comment-body h4 { margin: 0 0 2px; font-size: 0.9rem; color: #5cc0ff; }
  .comment-body p { margin: 0; font-size: 0.85rem; color: #bcd9f7; word-break: break-word; }

  .add-comment-box { display: flex; gap: 8px; margin-top: 10px; }
  .comment-input {
    flex-grow: 1;
    background: rgba(5,20,45,0.8);
    border: 1px solid rgba(120,185,255,0.3);
    border-radius: 8px;
    padding: 8px 12px;
    color: #fff;
    font-size: 0.85rem;
  }

  footer { text-align: center; color: #8fb4dc; font-size: .9rem; padding: 10px 0 40px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="glass">
    <div class="header-left">
      <img class="logo-small" src="logo.png" alt="Logo Fanpage">
      <h1>Annunci & Post</h1>
    </div>
    <a class="btn" href="index.html">← Torna alla Home</a>
  </header>

  <section class="glass">
    <h2>Ultime novità dallo Staff</h2>
    <p>Qui raccogliamo gli annunci ufficiali, i comunicati e gli aggiornamenti importanti per la community.</p>
  </section>

  <!-- Form di Pubblicazione Annuncio (Visibile SOLO al tuo UID admin) -->
  <section id="admin-post-section" class="glass" style="display: none;">
    <h2>Pubblica Annuncio Ufficiale (Admin)</h2>
    <div class="create-announcement-form">
      <input type="text" id="announcement-title" class="input-field" placeholder="Titolo dell'annuncio...">
      <textarea id="announcement-content" class="input-field" placeholder="Contenuto dell'annuncio..."></textarea>
      <input type="text" id="announcement-youtube" class="input-field" placeholder="Link YouTube (opzionale, es. https://youtu.be/...)">
      <input type="text" id="announcement-reddit" class="input-field" placeholder="Link Immagine Reddit (opzionale, es. https://i.redd.it/...)">
      <button class="btn" style="align-self: flex-end;" onclick="publishAnnouncement()">Pubblica Annuncio</button>
    </div>
  </section>

  <!-- Contenitore Annunci da Firebase -->
  <div id="announcements-container">
    <div class="glass" style="text-align: center;">Caricamento annunci in corso...</div>
  </div>

  <footer>Zeb89 Fanpage · Tutti i diritti riservati</footer>

</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { 
    getFirestore, 
    collection, 
    addDoc, 
    deleteDoc,
    doc, 
    query, 
    orderBy, 
    onSnapshot,
    serverTimestamp 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAHtswW-j0O0tWHHOyJP6QROFvsN_SKHqs",
    authDomain: "zeb89fanpage-9a3dc.firebaseapp.com",
    projectId: "zeb89fanpage-9a3dc",
    storageBucket: "zeb89fanpage-9a3dc.firebasestorage.app",
    messagingSenderId: "630651020835",
    appId: "1:630651020835:web:51e425c5e35d782f8e7396",
    measurementId: "G-578X21KF8L"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const ADMIN_UID = "ZP8lYMOoSFUuPVb55I0rXwiqo8a2"; 

  onAuthStateChanged(auth, (user) => {
    const adminSec = document.getElementById('admin-post-section');
    if (user && user.uid === ADMIN_UID) {
      adminSec.style.display = 'block';
    } else {
      adminSec.style.display = 'none';
    }
  });

  function getYouTubeEmbedUrl(url) {
    if (!url) return null;
    let videoId = "";
    if (url.includes("youtu.be/")) {
      videoId = url.split("youtu.be/")[1]?.split("?")[0];
    } else if (url.includes("watch?v=")) {
      videoId = url.split("watch?v=")[1]?.split("&")[0];
    }
    return videoId ? `https://www.youtube.com/embed/${videoId}` : null;
  }

  window.publishAnnouncement = async function() {
    const title = document.getElementById('announcement-title').value.trim();
    const content = document.getElementById('announcement-content').value.trim();
    const ytUrl = document.getElementById('announcement-youtube').value.trim();
    const redditImg = document.getElementById('announcement-reddit').value.trim();

    if (!title || !content) {
      alert("Titolo e contenuto sono obbligatori!");
      return;
    }

    if (redditImg && !redditImg.includes("redd.it") && !redditImg.includes("reddit.com")) {
      alert("L'immagine deve provenire da Reddit (es. i.redd.it)");
      return;
    }

    try {
      await addDoc(collection(db, "announcements"), {
        title,
        content,
        youtubeUrl: getYouTubeEmbedUrl(ytUrl),
        redditImage: redditImg || null,
        author: "Staff Ufficiale",
        uid: auth.currentUser.uid,
        createdAt: serverTimestamp()
      });
      document.getElementById('announcement-title').value = "";
      document.getElementById('announcement-content').value = "";
      document.getElementById('announcement-youtube').value = "";
      document.getElementById('announcement-reddit').value = "";
    } catch (e) {
      alert("Errore durante la pubblicazione.");
    }
  };

  window.deleteAnnouncement = async function(id) {
    if (confirm("Vuoi eliminare questo annuncio?")) {
      try {
        await deleteDoc(doc(db, "announcements", id));
      } catch (e) {
        alert("Errore durante l'eliminazione.");
      }
    }
  };

  window.addComment = async function(annId, btn) {
    const input = btn.previousElementSibling;
    const text = input.value.trim();

    if (!text) return;
    if (!auth.currentUser) {
      alert("Devi effettuare l'accesso per commentare!");
      return;
    }
    if (text.includes("http://") || text.includes("https://") || text.includes("www.")) {
      alert("Nei commenti non è consentito inserire link web o immagini!");
      return;
    }

    try {
      await addDoc(collection(db, "announcements", annId, "comments"), {
        text,
        author: auth.currentUser.displayName || "Utente",
        uid: auth.currentUser.uid,
        createdAt: serverTimestamp()
      });
      input.value = "";
    } catch (e) {
      alert("Errore nell'invio del commento.");
    }
  };

  window.deleteComment = async function(annId, commId) {
    try {
      await deleteDoc(doc(db, "announcements", annId, "comments", commId));
    } catch (e) {
      alert("Non puoi eliminare questo commento.");
    }
  };

  const q = query(collection(db, "announcements"), orderBy("createdAt", "desc"));
  onSnapshot(q, (snapshot) => {
    const container = document.getElementById('announcements-container');
    container.innerHTML = "";

    if (snapshot.empty) {
      container.innerHTML = `<div class="glass" style="text-align: center;">Nessun annuncio ufficiale presente.</div>`;
      return;
    }

    snapshot.docs.forEach(docSnap => {
      const post = docSnap.data();
      const postId = docSnap.id;
      const dateStr = post.createdAt ? new Date(post.createdAt.seconds * 1000).toLocaleDateString("it-IT", { day: 'numeric', month: 'long', year: 'numeric' }) : "Inviando...";
      const isAdmin = auth.currentUser && auth.currentUser.uid === ADMIN_UID;

      let mediaHtml = "";
      if (post.redditImage) {
        mediaHtml += `<div class="post-media"><img src="${escapeHtml(post.redditImage)}" alt="Immagine Reddit"></div>`;
      }
      if (post.youtubeUrl) {
        mediaHtml += `<div class="post-media"><iframe src="${post.youtubeUrl}" allowfullscreen></iframe></div>`;
      }

      const card = document.createElement('div');
      card.className = 'post-card';
      card.innerHTML = `
        <div class="post-date">
          <span>📅 ${dateStr} — <span class="author-tag">${escapeHtml(post.author)}</span></span>
          ${isAdmin ? `<button class="btn btn-danger" style="padding: 2px 8px; font-size: 0.75rem;" onclick="deleteAnnouncement('${postId}')">Elimina</button>` : ''}
        </div>
        <div class="post-title"><strong>${escapeHtml(post.title)}</strong></div>
        <p class="post-content">${escapeHtml(post.content)}</p>
        ${mediaHtml}
        
        <div class="post-footer">
          <button class="comment-toggle-btn" onclick="toggleComments(this)">💬 Mostra commenti</button>
          <button class="vote-btn" onclick="this.classList.toggle('active')">👍︎</button>
        </div>

        <div class="comments-section">
          <div id="comments-list-${postId}">Caricamento commenti...</div>
          <div class="add-comment-box">
            <input type="text" class="comment-input" placeholder="Scrivi un commento (senza link)..." onkeydown="if(event.key==='Enter') addComment('${postId}', this.nextElementSibling)">
            <button class="btn" style="padding: 6px 12px; font-size: 0.8rem;" onclick="addComment('${postId}', this)">Invia</button>
          </div>
        </div>
      `;
      container.appendChild(card);

      onSnapshot(query(collection(db, "announcements", postId, "comments"), orderBy("createdAt", "asc")), (commSnap) => {
        const commList = document.getElementById(`comments-list-${postId}`);
        if(commList) {
          commList.innerHTML = commSnap.empty ? "<p style='font-size:0.8rem; color:#8fb4dc; margin-bottom:8px;'>Nessun commento.</p>" : "";
          commSnap.docs.forEach(cDoc => {
            const cData = cDoc.data();
            const cId = cDoc.id;
            const canDelete = auth.currentUser && (auth.currentUser.uid === cData.uid || auth.currentUser.uid === ADMIN_UID);

            const item = document.createElement('div');
            item.className = 'comment-item';
            item.innerHTML = `
              <div class="comment-body">
                <h4>${escapeHtml(cData.author)}</h4>
                <p>${escapeHtml(cData.text)}</p>
              </div>
              ${canDelete ? `<button class="btn btn-danger" style="padding: 2px 6px; font-size: 0.7rem;" onclick="deleteComment('${postId}', '${cId}')">X</button>` : ''}
            `;
            commList.appendChild(item);
          });
        }
      });
    });
  });

  window.toggleComments = function(btn) {
    const card = btn.closest('.post-card');
    const section = card.querySelector('.comments-section');
    section.classList.toggle('open');
    btn.textContent = section.classList.contains('open') ? '💬 Nascondi commenti' : '💬 Mostra commenti';
  };

  function escapeHtml(text) {
    if(!text) return "";
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
</script>
</body>
</html>

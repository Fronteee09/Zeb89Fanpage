<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annunci e Post - Zeb89 Fanpage</title>
<link rel="icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: #dbeafe;
    line-height: 1.6;
    overflow-x: hidden;
    background:
      radial-gradient(circle at 15% 8%, rgba(80,170,255,.35), transparent 38%),
      radial-gradient(circle at 90% 35%, rgba(40,120,220,.35), transparent 42%),
      linear-gradient(160deg, #0a1f3d 0%, #07152b 50%, #030a16 100%);
    background-attachment: fixed;
  }
  .wrap { width: 100%; max-width: 760px; margin: 0 auto; padding: 18px; }

  .glass {
    background: linear-gradient(180deg, rgba(120,190,255,.22), rgba(20,50,95,.35));
    border: 1px solid rgba(140,200,255,.45);
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(0,0,0,.6), inset 0 1px 0 rgba(200,230,255,.5);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    padding: 20px;
    margin-bottom: 18px;
  }

  header.glass { margin-top: 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; padding: 20px 24px; }
  
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo-small {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid rgba(140,200,255,.7);
  }

  h1 {
    margin: 0;
    font-size: 1.6rem;
    color: #fff;
    text-shadow: 0 0 10px rgba(90,180,255,.8);
  }

  .btn {
    display: inline-block;
    padding: 8px 16px;
    color: #fff;
    font-weight: 600;
    font-size: 0.9rem;
    text-decoration: none;
    border: 1px solid #6cc0ff;
    border-radius: 999px;
    background: linear-gradient(180deg, #5cc0ff 0%, #1f7fd8 50%, #0d56ad 51%, #2a96e8 100%);
    box-shadow: 0 0 12px rgba(80,170,255,.6), inset 0 1px 0 rgba(255,255,255,.7);
    cursor: pointer;
  }
  .btn:active { filter: brightness(.9); }
  .btn-danger {
    background: linear-gradient(180deg, #ff6b6b 0%, #c92a2a 100%);
    border-color: #ffa8a8;
  }

  .admin-input, .admin-textarea {
    width: 100%;
    background: rgba(5,20,45,0.8);
    border: 1px solid rgba(120,185,255,0.3);
    border-radius: 8px;
    padding: 10px 14px;
    color: #fff;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .admin-input:focus, .admin-textarea:focus { outline: none; border-color: #5cc0ff; }
  .admin-textarea { resize: vertical; min-height: 80px; }

  .post-card {
    background: rgba(5,20,45,.65);
    border: 1px solid rgba(120,185,255,.35);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .post-date { font-size: 0.85rem; color: #8fb4dc; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
  .author-tag { color: #5cc0ff; font-weight: 600; }
  
  .post-title { margin: 0 0 8px; font-size: 1.15rem; color: #fff; }
  .post-content { margin: 0 0 12px; color: #bcd9f7; font-size: 0.9rem; line-height: 1.4; white-space: pre-wrap; }

  .post-media {
    margin-bottom: 12px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid rgba(120,185,255,0.3);
  }
  .post-media img {
    width: 100%;
    max-height: 350px;
    object-fit: cover;
    display: block;
  }

  .post-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(120,185,255,.2);
    padding-top: 10px;
    margin-top: 10px;
  }

  .vote-btn {
    background: rgba(80,170,255,0.1);
    border: 1px solid rgba(120,185,255,0.3);
    color: #bcd9f7;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
  }
  .vote-btn:hover { background: rgba(80,170,255,0.25); border-color: rgba(120,185,255,0.6); }
  .vote-btn.active {
    background: linear-gradient(180deg, #5cc0ff 0%, #1f7fd8 100%);
    color: #fff;
    border-color: #8fd0ff;
    box-shadow: 0 0 10px rgba(80,170,255,0.5);
  }

  .comment-toggle-btn {
    background: transparent;
    border: 1px solid rgba(120,185,255,0.3);
    color: #8fb4dc;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
  }
  .comment-toggle-btn:hover { background: rgba(80,170,255,0.15); color: #fff; }

  .comments-section {
    display: none;
    margin-top: 14px;
    border-top: 1px dashed rgba(120,185,255,0.3);
    padding-top: 12px;
  }
  .comments-section.open { display: block; }

  .comment-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 10px;
    background: rgba(10,30,60,0.4);
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid rgba(120,185,255,0.15);
  }
  .comment-body h4 { margin: 0 0 2px; font-size: 0.9rem; color: #5cc0ff; }
  .comment-body p { margin: 0; font-size: 0.85rem; color: #bcd9f7; word-break: break-word; }

  .add-comment-box { display: flex; gap: 8px; margin-top: 10px; }
  .comment-input {
    flex-grow: 1;
    background: rgba(5,20,45,0.8);
    border: 1px solid rgba(120,185,255,0.3);
    border-radius: 8px;
    padding: 8px 12px;
    color: #fff;
    font-size: 0.85rem;
  }

  footer { text-align: center; color: #8fb4dc; font-size: .9rem; padding: 10px 0 40px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="glass">
    <div class="header-left">
      <img class="logo-small" src="logo.png" alt="Logo Annunci">
      <h1>Annunci & Post Ufficiali</h1>
    </div>
    <a class="btn" href="index.html">← Torna alla Home</a>
  </header>

  <!-- Pannello Creazione Admin (Visibile solo al tuo UID) -->
  <section id="admin-announcement-section" class="glass" style="display: none;">
    <h2>Crea Annuncio Ufficiale (Admin)</h2>
    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
      <input type="text" id="new-title" class="admin-input" placeholder="Titolo dell'annuncio...">
      <textarea id="new-content" class="admin-textarea" placeholder="Scrivi il contenuto dell'annuncio..."></textarea>
      <input type="text" id="new-img" class="admin-input" placeholder="Link immagine Reddit opzionale (es. https://i.redd.it/...)">
      <button class="btn" style="align-self: flex-end;" onclick="publishAnnouncement()">Pubblica Annuncio</button>
    </div>
  </section>

  <!-- Lista Annunci -->
  <div id="announcements-container">
    <div class="glass" style="text-align: center;">Caricamento annunci in corso...</div>
  </div>

  <footer>Zeb89 Fanpage · Tutti i diritti riservati</footer>

</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { 
    getFirestore, 
    collection, 
    addDoc, 
    deleteDoc,
    doc, 
    setDoc,
    getDoc,
    query, 
    orderBy, 
    onSnapshot,
    serverTimestamp 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAHtswW-j0O0tWHHOyJP6QROFvsN_SKHqs",
    authDomain: "zeb89fanpage-9a3dc.firebaseapp.com",
    projectId: "zeb89fanpage-9a3dc",
    storageBucket: "zeb89fanpage-9a3dc.firebasestorage.app",
    messagingSenderId: "630651020835",
    appId: "1:630651020835:web:51e425c5e35d782f8e7396",
    measurementId: "G-578X21KF8L"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const ADMIN_UID = "ZP8lYMOoSFUuPVb55I0rXwiqo8a2";

  onAuthStateChanged(auth, (user) => {
    const adminSec = document.getElementById('admin-announcement-section');
    if (user && user.uid === ADMIN_UID) {
      adminSec.style.display = 'block';
    } else {
      adminSec.style.display = 'none';
    }
  });

  window.publishAnnouncement = async function() {
    const title = document.getElementById('new-title').value.trim();
    const content = document.getElementById('new-content').value.trim();
    const img = document.getElementById('new-img').value.trim();

    if (!title || !content) {
      alert("Il titolo e il contenuto sono obbligatori!");
      return;
    }

    if (img && !img.includes("redd.it") && !img.includes("reddit.com")) {
      alert("L'immagine deve provenire da Reddit (es. i.redd.it)");
      return;
    }

    try {
      await addDoc(collection(db, "announcements"), {
        title,
        content,
        redditImage: img || null,
        likesCount: 0,
        createdAt: serverTimestamp()
      });
      document.getElementById('new-title').value = "";
      document.getElementById('new-content').value = "";
      document.getElementById('new-img').value = "";
    } catch (e) {
      alert("Errore durante la pubblicazione dell'annuncio.");
    }
  };

  window.deleteAnnouncement = async function(id) {
    if (confirm("Vuoi davvero eliminare questo annuncio?")) {
      try {
        await deleteDoc(doc(db, "announcements", id));
      } catch (e) {
        alert("Errore durante l'eliminazione.");
      }
    }
  };

  window.toggleLike = async function(announcementId) {
    if (!auth.currentUser) {
      alert("Devi effettuare l'accesso (tramite account.html o community.html) per mettere Mi piace!");
      return;
    }

    const userId = auth.currentUser.uid;
    const annRef = doc(db, "announcements", announcementId);
    const likeRef = doc(db, "announcements", announcementId, "likes", userId);

    try {
      const likeSnap = await getDoc(likeRef);
      const annSnap = await getDoc(annRef);
      let currentLikes = annSnap.data().likesCount || 0;

      if (likeSnap.exists()) {
        await deleteDoc(likeRef);
        currentLikes = Math.max(0, currentLikes - 1);
        await setDoc(annRef, { likesCount: currentLikes }, { merge: true });
      } else {
        await setDoc(likeRef, { createdAt: serverTimestamp() });
        currentLikes += 1;
        await setDoc(annRef, { likesCount: currentLikes }, { merge: true });
      }
    } catch (e) {
      console.error("Errore gestione like:", e);
    }
  };

  window.addFirebaseComment = async function(announcementId, btn) {
    if (!auth.currentUser) {
      alert("Devi effettuare l'accesso per commentare!");
      return;
    }

    const input = btn.previousElementSibling;
    const text = input.value.trim();

    if (!text) return;
    if (text.includes("http://") || text.includes("https://") || text.includes("www.")) {
      alert("Nei commenti non è consentito inserire link web o immagini!");
      return;
    }

    try {
      await addDoc(collection(db, "announcements", announcementId, "comments"), {
        text,
        author: auth.currentUser.displayName || "Utente",
        uid: auth.currentUser.uid,
        createdAt: serverTimestamp()
      });
      input.value = "";
    } catch (e) {
      alert("Errore nell'invio del commento.");
    }
  };

  window.deleteComment = async function(announcementId, commentId) {
    try {
      await deleteDoc(doc(db, "announcements", announcementId, "comments", commentId));
    } catch (e) {
      alert("Non puoi eliminare questo commento.");
    }
  };

  const q = query(collection(db, "announcements"), orderBy("createdAt", "desc"));
  onSnapshot(q, (snapshot) => {
    const container = document.getElementById('announcements-container');
    container.innerHTML = "";

    if (snapshot.empty) {
      container.innerHTML = `<div class="glass" style="text-align: center;">Nessun annuncio presente.</div>`;
      return;
    }

    snapshot.docs.forEach(docSnap => {
      const item = docSnap.data();
      const id = docSnap.id;
      const dateStr = item.createdAt ? new Date(item.createdAt.seconds * 1000).toLocaleDateString("it-IT", { day: 'numeric', month: 'long', year: 'numeric' }) : "Inviando...";
      const isUserAdmin = auth.currentUser && auth.currentUser.uid === ADMIN_UID;
      const likesCount = item.likesCount || 0;

      let mediaHtml = item.redditImage ? `<div class="post-media"><img src="${escapeHtml(item.redditImage)}" alt="Immagine Annuncio"></div>` : "";

      const card = document.createElement('div');
      card.className = 'post-card';
      card.innerHTML = `
        <div class="post-date">
          <span>📅 ${dateStr} — <span class="author-tag">Zeb89 Fanpage Official</span></span>
          ${isUserAdmin ? `<button class="btn btn-danger" style="padding: 2px 8px; font-size: 0.75rem;" onclick="deleteAnnouncement('${id}')">Elimina</button>` : ''}
        </div>
        <div class="post-title"><strong>${escapeHtml(item.title)}</strong></div>
        <p class="post-content">${escapeHtml(item.content)}</p>
        ${mediaHtml}

        <div class="post-footer">
          <button class="comment-toggle-btn" onclick="toggleComments(this)">💬 Mostra commenti</button>
          <button class="vote-btn" id="like-btn-${id}" onclick="toggleLike('${id}')">
            👍︎ <span id="like-count-${id}">${likesCount}</span>
          </button>
        </div>

        <div class="comments-section">
          <div id="comments-list-${id}">Caricamento...</div>
          <div class="add-comment-box">
            <input type="text" class="comment-input" placeholder="Scrivi un commento (senza link)..." onkeydown="if(event.key==='Enter') addFirebaseComment('${id}', this.nextElementSibling)">
            <button class="btn" style="padding: 6px 12px; font-size: 0.8rem;" onclick="addFirebaseComment('${id}', this)">Invia</button>
          </div>
        </div>
      `;
      container.appendChild(card);

      if (auth.currentUser) {
        const likeDocRef = doc(db, "announcements", id, "likes", auth.currentUser.uid);
        onSnapshot(likeDocRef, (likeSnap) => {
          const btnLike = document.getElementById(`like-btn-${id}`);
          if (btnLike) {
            if (likeSnap.exists()) {
              btnLike.classList.add('active');
            } else {
              btnLike.classList.remove('active');
            }
          }
        });
      }

      onSnapshot(query(collection(db, "announcements", id, "comments"), orderBy("createdAt", "asc")), (commSnap) => {
        const commList = document.getElementById(`comments-list-${id}`);
        if(commList) {
          commList.innerHTML = commSnap.empty ? "<p style='font-size:0.8rem; color:#8fb4dc; margin-bottom:8px;'>Nessun commento.</p>" : "";
          commSnap.docs.forEach(cDoc => {
            const cData = cDoc.data();
            const cId = cDoc.id;
            const canDeleteComment = auth.currentUser && (
              auth.currentUser.uid === cData.uid || 
              auth.currentUser.uid === ADMIN_UID
            );

            const commItem = document.createElement('div');
            commItem.className = 'comment-item';
            commItem.innerHTML = `
              <div class="comment-body">
                <h4>${escapeHtml(cData.author)}</h4>
                <p>${escapeHtml(cData.text)}</p>
              </div>
              ${canDeleteComment ? `<button class="btn btn-danger" style="padding: 2px 6px; font-size: 0.7rem;" onclick="deleteComment('${id}', '${cId}')">X</button>` : ''}
            `;
            commList.appendChild(commItem);
          });
        }
      });
    });
  });

  window.toggleComments = function(btn) {
    const card = btn.closest('.post-card');
    const section = card.querySelector('.comments-section');
    section.classList.toggle('open');
    btn.textContent = section.classList.contains('open') ? '💬 Nascondi commenti' : '💬 Mostra commenti';
  };

  function escapeHtml(text) {
    if(!text) return "";
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
</script>
</body>
</html>

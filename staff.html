<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff - Zeb89 Fanpage</title>
<link rel="icon" href="logo.png">
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: #dbeafe;
    line-height: 1.6;
    overflow-x: hidden;
    background:
      radial-gradient(circle at 15% 8%, rgba(80,170,255,.35), transparent 38%),
      radial-gradient(circle at 90% 35%, rgba(40,120,220,.35), transparent 42%),
      linear-gradient(160deg, #0a1f3d 0%, #07152b 50%, #030a16 100%);
    background-attachment: fixed;
  }
  .wrap { width: 100%; max-width: 760px; margin: 0 auto; padding: 18px; }

  .glass {
    background: linear-gradient(180deg, rgba(120,190,255,.22), rgba(20,50,95,.35));
    border: 1px solid rgba(140,200,255,.45);
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(0,0,0,.6), inset 0 1px 0 rgba(200,230,255,.5);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    padding: 20px;
    margin-bottom: 18px;
  }

  header.glass { margin-top: 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; padding: 20px 24px; }
  
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo-small {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid rgba(140,200,255,.7);
  }

  h1 {
    margin: 0;
    font-size: 1.6rem;
    color: #fff;
    text-shadow: 0 0 10px rgba(90,180,255,.8);
  }

  .btn {
    display: inline-block;
    padding: 10px 20px;
    color: #fff;
    font-weight: 600;
    font-size: 0.9rem;
    text-decoration: none;
    border: 1px solid #6cc0ff;
    border-radius: 999px;
    background: linear-gradient(180deg, #5cc0ff 0%, #1f7fd8 50%, #0d56ad 51%, #2a96e8 100%);
    box-shadow: 0 0 12px rgba(80,170,255,.6), inset 0 1px 0 rgba(255,255,255,.7);
  }
  .btn:active { filter: brightness(.9); }

  h2 { margin: 0 0 10px; font-size: 1.35rem; color: #fff; text-shadow: 0 0 8px rgba(90,180,255,.6); }
  p { margin: 0 0 10px; color: #bcd9f7; }

  .staff-card {
    background: rgba(5,20,45,.65);
    border: 1px solid rgba(120,185,255,.35);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .staff-avatar {
    width: 60px;
    height: 60px;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid rgba(140,200,255,.7);
    box-shadow: 0 0 10px rgba(80,170,255,.5);
    flex-shrink: 0;
  }

  .staff-info h3 {
    margin: 0 0 4px;
    font-size: 1.15rem;
    color: #fff;
  }

  .staff-info p {
    margin: 0;
    color: #8fb4dc;
    font-size: 0.95rem;
  }

  footer { text-align: center; color: #8fb4dc; font-size: .9rem; padding: 10px 0 40px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="glass">
    <div class="header-left">
      <img class="logo-small" src="logo.png" alt="Logo">
      <h1>Staff della Fanpage</h1>
    </div>
    <a class="btn" href="index.html">← Torna alla Home</a>
  </header>

  <section class="glass">
    <h2>I nostri moderatori e sviluppatori</h2>
    <p>Ecco il team che gestisce la community e tiene in piedi la baracca.</p>
  </section>

  <!-- Membro 1: Fronte -->
  <div class="staff-card">
    <img class="staff-avatar" src="fronte.jpg" alt="Fronte">
    <div class="staff-info">
      <h3>Fronte ★</h3>
      <p>Dev</p>
    </div>
  </div>

  <!-- Membro 2: BotVivo -->
  <div class="staff-card">
    <img class="staff-avatar" src="botvivo.png" alt="BotVivo">
    <div class="staff-info">
      <h3>BotVivo</h3>
      <p>Moderatore Reddit</p>
    </div>
  </div>

  <!-- Membro 3: Albonz84 -->
  <div class="staff-card">
    <img class="staff-avatar" src="albonz84.jpg" alt="Albonz84">
    <div class="staff-info">
      <h3>Albonz84</h3>
      <p>Assistenza e Staff</p>
    </div>
  </div>

  <footer>Zeb89 Fanpage · Tutti i diritti riservati</footer>

</div>
</body>
</html>

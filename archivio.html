<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archivio - Zeb89 Fanpage</title>
<link rel="icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: #dbeafe;
    line-height: 1.6;
    overflow-x: hidden;
    background:
      radial-gradient(circle at 15% 8%, rgba(80,170,255,.35), transparent 38%),
      radial-gradient(circle at 90% 35%, rgba(40,120,220,.35), transparent 42%),
      linear-gradient(160deg, #0a1f3d 0%, #07152b 50%, #030a16 100%);
    background-attachment: fixed;
  }
  .wrap { width: 100%; max-width: 760px; margin: 0 auto; padding: 18px; }

  .glass {
    background: linear-gradient(180deg, rgba(120,190,255,.22), rgba(20,50,95,.35));
    border: 1px solid rgba(140,200,255,.45);
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(0,0,0,.6), inset 0 1px 0 rgba(200,230,255,.5);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    padding: 20px;
    margin-bottom: 18px;
  }

  header.glass { margin-top: 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; padding: 20px 24px; }
  
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo-small {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid rgba(140,200,255,.7);
  }

  h1 {
    margin: 0;
    font-size: 1.6rem;
    color: #fff;
    text-shadow: 0 0 10px rgba(90,180,255,.8);
  }

  .btn {
    display: inline-block;
    padding: 8px 16px;
    color: #fff;
    font-weight: 600;
    font-size: 0.9rem;
    text-decoration: none;
    border: 1px solid #6cc0ff;
    border-radius: 999px;
    background: linear-gradient(180deg, #5cc0ff 0%, #1f7fd8 50%, #0d56ad 51%, #2a96e8 100%);
    box-shadow: 0 0 12px rgba(80,170,255,.6), inset 0 1px 0 rgba(255,255,255,.7);
    cursor: pointer;
  }
  .btn:active { filter: brightness(.9); }
  .btn-danger { background: linear-gradient(180deg, #ff6b6b 0%, #c92a2a 100%); border-color: #ffa8a8; }

  /* Barra di ricerca e Form Admin */
  .search-input, .admin-input, .admin-textarea {
    width: 100%;
    background: rgba(5,20,45,0.8);
    border: 1px solid rgba(120,185,255,0.3);
    border-radius: 12px;
    padding: 12px 16px;
    color: #fff;
    font-size: 0.95rem;
    margin-bottom: 14px;
  }
  .search-input:focus, .admin-input:focus, .admin-textarea:focus { outline: none; border-color: #5cc0ff; }
  .admin-textarea { resize: vertical; min-height: 90px; }

  /* Schede Archivio */
  .archive-card {
    background: linear-gradient(180deg, rgba(20,50,95,0.6), rgba(5,20,45,0.8));
    border: 1px solid rgba(120,185,255,0.4);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .archive-card:hover {
    border-color: #5cc0ff;
    background: linear-gradient(180deg, rgba(30,70,120,0.7), rgba(10,35,65,0.9));
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(80,170,255,0.3);
  }
  .archive-title { font-size: 1.1rem; color: #fff; font-weight: 600; margin: 0; }

  /* Modale / Pop-up */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(3, 10, 22, 0.8);
    -webkit-backdrop-filter: blur(5px);
    backdrop-filter: blur(5px);
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 18px;
  }
  .modal-content {
    background: linear-gradient(180deg, #102a52 0%, #07152b 100%);
    border: 1px solid rgba(140,200,255,0.6);
    border-radius: 16px;
    width: 100%;
    max-width: 550px;
    padding: 24px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.8);
    position: relative;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-close {
    position: absolute;
    top: 15px; right: 20px;
    background: transparent;
    border: none;
    color: #8fb4dc;
    font-size: 1.5rem;
    cursor: pointer;
  }
  .modal-close:hover { color: #fff; }
  .modal-image {
    width: 100%;
    max-height: 280px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid rgba(120,185,255,0.3);
    margin-top: 12px;
    margin-bottom: 14px;
  }

  footer { text-align: center; color: #8fb4dc; font-size: .9rem; padding: 10px 0 40px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="glass">
    <div class="header-left">
      <img class="logo-small" src="logo.png" alt="Logo Fanpage">
      <h1>Archivio Storico</h1>
    </div>
    <a class="btn" href="index.html">← Torna alla Home</a>
  </header>

  <!-- Sezione Filtro / Ricerca -->
  <section class="glass" style="padding-bottom: 10px;">
    <p style="font-size: 0.9rem; margin-bottom: 8px;">Digita qui sotto per filtrare istantaneamente tra tutti gli elementi[cite: 1]:</p>
    <input type="text" id="search-box" class="search-input" placeholder="Cerca voce (es. Bibbiena, AceMedia, Orazio, Ultimate Arena...)" oninput="filterArchive()">
  </section>

  <!-- Pannello Creazione Admin (Visibile solo al tuo UID) -->
  <section id="admin-archive-section" class="glass" style="display: none;">
    <h2>Aggiungi Voce in Archivio (Admin)</h2>
    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
      <input type="text" id="new-title" class="admin-input" placeholder="Titolo voce (es. Bibbiena (Luogo Storico))">
      <textarea id="new-desc" class="admin-textarea" placeholder="Descrizione dettagliata della voce..."></textarea>
      <input type="text" id="new-img" class="admin-input" placeholder="Link immagine (es. link Reddit o Imgur)">
      <button class="btn" style="align-self: flex-end;" onclick="publishCard()">Crea Scheda</button>
    </div>
  </section>

  <!-- Lista delle Schede -->
  <div id="archive-container">
    <div class="glass" style="text-align: center;">Caricamento archivio in corso...</div>
  </div>

  <footer>Zeb89 Fanpage · Tutti i diritti riservati</footer>

</div>

<!-- Modale Pop-up Dettaglio -->
<div id="archive-modal" class="modal-overlay" onclick="closeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModalDirect()">×</button>
    <h2 id="modal-title" style="margin-top: 0; color: #fff;">Titolo</h2>
    <p id="modal-desc" style="color: #bcd9f7; white-space: pre-wrap; font-size: 0.95rem;"></p>
    <div id="modal-media-container"></div>
    <div id="modal-admin-actions" style="margin-top: 15px; text-align: right; display: none;">
      <button class="btn btn-danger" id="modal-delete-btn" onclick="">Elimina Scheda</button>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { 
    getFirestore, 
    collection, 
    addDoc, 
    deleteDoc,
    doc, 
    query, 
    orderBy, 
    onSnapshot,
    serverTimestamp 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAHtswW-j0O0tWHHOyJP6QROFvsN_SKHqs",
    authDomain: "zeb89fanpage-9a3dc.firebaseapp.com",
    projectId: "zeb89fanpage-9a3dc",
    storageBucket: "zeb89fanpage-9a3dc.firebasestorage.app",
    messagingSenderId: "630651020835",
    appId: "1:630651020835:web:51e425c5e35d782f8e7396",
    measurementId: "G-578X21KF8L"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const ADMIN_UID = "ZP8lYMOoSFUuPVb55I0rXwiqo8a2";
  let allCardsData = [];

  onAuthStateChanged(auth, (user) => {
    const adminSec = document.getElementById('admin-archive-section');
    if (user && user.uid === ADMIN_UID) {
      adminSec.style.display = 'block';
    } else {
      adminSec.style.display = 'none';
    }
  });

  window.publishCard = async function() {
    const title = document.getElementById('new-title').value.trim();
    const desc = document.getElementById('new-desc').value.trim();
    const img = document.getElementById('new-img').value.trim();

    if (!title || !desc) {
      alert("Titolo e descrizione sono obbligatori!");
      return;
    }

    try {
      await addDoc(collection(db, "archive"), {
        title,
        description: desc,
        imageUrl: img || null,
        createdAt: serverTimestamp()
      });
      document.getElementById('new-title').value = "";
      document.getElementById('new-desc').value = "";
      document.getElementById('new-img').value = "";
    } catch (e) {
      alert("Errore durante la creazione della scheda.");
    }
  };

  window.deleteCard = async function(id) {
    if (confirm("Vuoi davvero eliminare questa scheda dall'archivio?")) {
      try {
        await deleteDoc(doc(db, "archive", id));
        closeModalDirect();
      } catch (e) {
        alert("Errore durante l'eliminazione.");
      }
    }
  };

  // Caricamento in tempo reale dell'archivio da Firestore
  const q = query(collection(db, "archive"), orderBy("title", "asc"));
  onSnapshot(q, (snapshot) => {
    const container = document.getElementById('archive-container');
    container.innerHTML = "";
    allCardsData = [];

    if (snapshot.empty) {
      container.innerHTML = `<div class="glass" style="text-align: center;">Nessun elemento in archivio.</div>`;
      return;
    }

    snapshot.docs.forEach(docSnap => {
      const data = docSnap.data();
      const id = docSnap.id;
      allCardsData.push({ id, ...data });
    });

    renderCards(allCardsData);
  });

  function renderCards(cards) {
    const container = document.getElementById('archive-container');
    container.innerHTML = "";

    if (cards.length === 0) {
      container.innerHTML = `<div class="glass" style="text-align: center;">Nessun risultato trovato.</div>`;
      return;
    }

    cards.forEach(card => {
      const el = document.createElement('div');
      el.className = 'archive-card';
      el.innerHTML = `
        <h3 class="archive-title">${escapeHtml(card.title)}</h3>
        <span style="color: #5cc0ff; font-size: 0.9rem;">Visualizza →</span>
      `;
      el.onclick = () => openModal(card);
      container.appendChild(el);
    });
  }

  window.filterArchive = function() {
    const queryStr = document.getElementById('search-box').value.toLowerCase();
    const filtered = allCardsData.filter(card => card.title.toLowerCase().includes(queryStr));
    renderCards(filtered);
  };

  window.openModal = function(card) {
    document.getElementById('modal-title').textContent = card.title;
    document.getElementById('modal-desc').textContent = card.description;
    
    const mediaContainer = document.getElementById('modal-media-container');
    mediaContainer.innerHTML = card.imageUrl ? `<img src="${escapeHtml(card.imageUrl)}" class="modal-image" alt="Immagine Archivio">` : "";

    const user = auth.currentUser;
    const adminActions = document.getElementById('modal-admin-actions');
    const deleteBtn = document.getElementById('modal-delete-btn');

    if (user && user.uid === ADMIN_UID) {
      adminActions.style.display = 'block';
      deleteBtn.setAttribute('onclick', `deleteCard('${card.id}')`);
    } else {
      adminActions.style.display = 'none';
    }

    document.getElementById('archive-modal').style.display = 'flex';
  };

  window.closeModalDirect = function() {
    document.getElementById('archive-modal').style.display = 'none';
  };

  window.closeModal = function(e) {
    if (e.target.id === 'archive-modal') {
      closeModalDirect();
    }
  };

  function escapeHtml(text) {
    if(!text) return "";
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
</script>
</body>
</html>
